name: Release
# Push a tag such as v0.2.0 to publish a release. The tag's number becomes the version inside the package.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :quartet-core:test :quartet-runtime:test :quartet-generator:test --console=plain

  package:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@v4
      - name: Work out the version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tags look like v1.2.3, not $TAG" >&2; exit 1 ;; esac
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - run: ./gradlew -PreleaseVersion="$VERSION" :quartet-generator:distZip --console=plain
      - name: Check the package starts and answers the MCP handshake
        run: |
          mkdir unpacked && unzip -q quartet-generator/build/distributions/quartet-qe-"$VERSION".zip -d unpacked
          scripts/smoke-release.sh unpacked/quartet-qe-"$VERSION" "$VERSION"
      - name: Write the checksum
        run: |
          mkdir release
          cp quartet-generator/build/distributions/quartet-qe-"$VERSION".zip release/
          (cd release && sha256sum quartet-qe-"$VERSION".zip > quartet-qe-"$VERSION".zip.sha256)
      - uses: actions/upload-artifact@v4
        with: {name: release, path: release/*}

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: release, path: release}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
