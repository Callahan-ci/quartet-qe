name: Release
# Push a tag such as v0.2.0 to publish a release. The tag's number becomes the version inside the package.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: ./gradlew :quartet-core:test :quartet-runtime:test :quartet-generator:test --console=plain

  package:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write       # lets the run prove where the files came from (build provenance)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with: {distribution: temurin, java-version: "21"}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Work out the version from the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Tags look like v1.2.3, not $TAG" >&2; exit 1 ;; esac
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Build the zip and the extension bundles (one per platform)
        run: ./gradlew -PreleaseVersion="$VERSION" :quartet-generator:distZip :quartet-generator:mcpbBundles --console=plain
      - name: Check the extension manifest with the official tool
        run: |
          mkdir manifest-check && unzip -q quartet-generator/build/distributions/quartet-qe-"$VERSION"-linux.mcpb manifest.json icon.png -d manifest-check
          (cd manifest-check && npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json)
      - name: Check the zip starts and walks the first-time path
        run: |
          mkdir unpacked && unzip -q quartet-generator/build/distributions/quartet-qe-"$VERSION".zip -d unpacked
          scripts/smoke-release.sh unpacked/quartet-qe-"$VERSION" "$VERSION"
      - name: Check the Linux extension bundle the same way
        run: |
          mkdir bundle && unzip -q quartet-generator/build/distributions/quartet-qe-"$VERSION"-linux.mcpb -d bundle
          scripts/smoke-release.sh bundle "$VERSION"
      - name: Sign the extension bundles
        # A certificate is optional. Without one the bundles are published unsigned and say so; they are never self-signed,
        # because a signature nobody can trace to a publisher would only look like assurance.
        env:
          MCPB_CERT_PEM: ${{ secrets.MCPB_CERT_PEM }}
          MCPB_KEY_PEM: ${{ secrets.MCPB_KEY_PEM }}
          MCPB_INTERMEDIATE_PEM: ${{ secrets.MCPB_INTERMEDIATE_PEM }}
        run: |
          if [ -z "$MCPB_CERT_PEM" ] || [ -z "$MCPB_KEY_PEM" ]; then
            echo "::notice::No signing certificate is configured (secrets MCPB_CERT_PEM and MCPB_KEY_PEM), so the extension bundles are published unsigned."
            exit 0
          fi
          umask 077
          printf '%s' "$MCPB_CERT_PEM" > "$RUNNER_TEMP/cert.pem"
          printf '%s' "$MCPB_KEY_PEM" > "$RUNNER_TEMP/key.pem"
          args=(--cert "$RUNNER_TEMP/cert.pem" --key "$RUNNER_TEMP/key.pem")
          if [ -n "$MCPB_INTERMEDIATE_PEM" ]; then
            printf '%s' "$MCPB_INTERMEDIATE_PEM" > "$RUNNER_TEMP/intermediate.pem"
            args+=(--intermediate "$RUNNER_TEMP/intermediate.pem")
          fi
          for bundle in quartet-generator/build/distributions/*.mcpb; do
            npx --yes @anthropic-ai/mcpb@2.1.2 sign "${args[@]}" "$bundle"
            npx --yes @anthropic-ai/mcpb@2.1.2 verify "$bundle"
          done
          rm -f "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/intermediate.pem"
      - name: List what is inside (software bill of materials)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: unpacked/quartet-qe-${{ env.VERSION }}
          format: cyclonedx-json
          output-file: quartet-qe-${{ env.VERSION }}.cdx.json
          upload-artifact: false
      - name: Write the checksums
        run: |
          mkdir release
          cp quartet-generator/build/distributions/quartet-qe-"$VERSION".zip quartet-generator/build/distributions/*.mcpb quartet-qe-"$VERSION".cdx.json release/
          (cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Record where these files were built (provenance)
        # Public repositories only: GitHub offers this for private ones on a paid plan. Anyone can then check a download with
        #   gh attestation verify <file> --repo goughliam1813/quartet-qe
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: release, path: release/*}

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: release, path: release}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
