# The Quartet QE this repo was written with. CI fetches this version when Quartet is not installed on the agent.
quartetRepo: __QUARTET_URL__
quartetVersion: __QUARTET_REF__
context: context
environment: context/environments/default.yaml
connectors: connectors.yaml
reports: reports
faults: context/quality/faults.yaml
tests:
  command: ["./gradlew", "test", "--rerun", "--tests", "{selector}", "--console=plain"]
  results: build/test-results/test
  source: src/test/java
